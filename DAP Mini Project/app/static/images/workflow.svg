<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="100" x2="400" y2="100" stroke="#007bff" stroke-width="3"/>
  <line x1="100" y1="100" x2="100" y2="300" stroke="#007bff" stroke-width="3"/>
  <line x1="400" y1="100" x2="400" y2="300" stroke="#007bff" stroke-width="3"/>
  <line x1="100" y1="300" x2="400" y2="300" stroke="#007bff" stroke-width="3"/>
  <line x1="250" y1="100" x2="250" y2="200" stroke="#007bff" stroke-width="3"/>
  
  <!-- Workflow nodes -->
  <circle cx="100" cy="100" r="30" fill="#007bff"/>
  <text x="100" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="white">1</text>
  
  <circle cx="250" cy="100" r="30" fill="#28a745"/>
  <text x="250" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="white">2</text>
  
  <circle cx="400" cy="100" r="30" fill="#dc3545"/>
  <text x="400" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="white">3</text>
  
  <circle cx="250" cy="200" r="30" fill="#ffc107"/>
  <text x="250" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="white">4</text>
  
  <circle cx="100" cy="300" r="30" fill="#6c757d"/>
  <text x="100" y="305" font-family="Arial" font-size="16" text-anchor="middle" fill="white">5</text>
  
  <circle cx="400" cy="300" r="30" fill="#17a2b8"/>
  <text x="400" y="305" font-family="Arial" font-size="16" text-anchor="middle" fill="white">6</text>
</svg> 