<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <circle cx="250" cy="200" r="150" fill="#e9ecef" stroke="#007bff" stroke-width="2"/>
  
  <!-- Dollar sign -->
  <text x="250" y="225" font-family="Arial" font-size="120" text-anchor="middle" fill="#007bff">$</text>
  
  <!-- Graph lines -->
  <polyline points="100,300 150,250 200,280 250,220 300,180 350,150 400,120" fill="none" stroke="#28a745" stroke-width="3"/>
  <polyline points="100,320 150,300 200,330 250,290 300,250 350,270 400,240" fill="none" stroke="#dc3545" stroke-width="3"/>
  
  <!-- Small coins -->
  <circle cx="120" cy="100" r="15" fill="#ffc107"/>
  <circle cx="150" cy="120" r="20" fill="#ffc107"/>
  <circle cx="350" cy="80" r="25" fill="#ffc107"/>
  <circle cx="390" cy="100" r="18" fill="#ffc107"/>
</svg> 